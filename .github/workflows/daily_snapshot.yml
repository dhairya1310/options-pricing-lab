# Every weekday after the US close: pull fresh option chains, rerun the whole
# pipeline, and commit the results. The live Streamlit app reads those files,
# so it shows the latest close by the next morning with nobody touching it.
#
# Timing: GitHub schedules run on UTC. 21:30 UTC is 5:30 PM New York time in
# summer and 4:30 PM in winter, so it always lands after the 4 PM close
# (and after SPY options stop at 4:15 PM). GitHub can start scheduled jobs
# up to an hour late on busy days, which is fine here.
#
# Needs one repository secret: FRED_API_KEY (Settings > Secrets and variables > Actions).

name: Daily option chain snapshot

on:
  schedule:
    - cron: "30 21 * * 1-5"   # Monday to Friday
  workflow_dispatch:           # adds a "Run workflow" button for manual runs

# The job pushes the new results back to the repo, so it needs write access
permissions:
  contents: write

# Never let two runs overlap and fight over the same commit
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # If someone broke the pricers, stop here instead of saving data
      - name: Run the pricing tests
        run: python -m pytest -q

      # --skip-if-closed: weekends are already excluded above, this catches
      #   exchange holidays so we never save a copy of the previous session
      # --strict: any ticker failing turns the run red and GitHub emails you
      - name: Pull the option chains
        run: python -m src.data_pull --strict --skip-if-closed

      # Only run the pipeline when a new snapshot actually arrived
      - name: Check for a new snapshot
        id: fresh
        run: |
          if [ -n "$(git status --porcelain data/raw)" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new snapshot, the market was closed."
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      # Every step has its own sanity checks. If any of them fails, the job
      # stops here, nothing is committed, and the app keeps the last good data.
      - name: Run the pipeline
        if: steps.fresh.outputs.new == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m src.clean
          python -m src.inputs
          python -m src.implied_vol
          python -m src.surface
          python -m src.model_vs_market
          python -m src.parity
          python -m src.convergence
          python -m src.memo_stats
          python -m src.prune

      - name: Commit the results
        if: steps.fresh.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi
          git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
          git push
